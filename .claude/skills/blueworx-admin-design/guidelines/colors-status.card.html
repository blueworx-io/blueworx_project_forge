<!-- @dsCard group="Colors" viewport="700x170" name="Status" subtitle="WordPress core notice hues — success, warning, danger, info" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Status</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--bw-font-body);color:var(--bw-text-body)}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;border-radius:var(--bw-radius-md);border:1px solid rgb(10 12 41 / .07)}.n{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--bw-text-body)}.v{font-size:11px;color:var(--bw-text-faint);font-family:var(--bw-font-mono)}.row{display:grid;gap:12px}.pair{display:flex;gap:0}.pair span{flex:1;height:56px}</style></head><body class="bw-admin" style="background:#fff"><div class="row" style="grid-template-columns:repeat(4,1fr)">
<div class="sw"><div class="chip pair" style="overflow:hidden"><span style="background:var(--bw-success)"></span><span style="background:var(--bw-success-deep)"></span><span style="background:var(--bw-success-wash)"></span></div><span class="n">Success</span><span class="v">#00A32A / #007017</span></div>
<div class="sw"><div class="chip pair" style="overflow:hidden"><span style="background:var(--bw-warning)"></span><span style="background:var(--bw-warning-deep)"></span><span style="background:var(--bw-warning-wash)"></span></div><span class="n">Warning</span><span class="v">#DBA617 / #8A6100</span></div>
<div class="sw"><div class="chip pair" style="overflow:hidden"><span style="background:var(--bw-danger)"></span><span style="background:var(--bw-danger-deep)"></span><span style="background:var(--bw-danger-wash)"></span></div><span class="n">Danger</span><span class="v">#D63638 / #B32D2E</span></div>
<div class="sw"><div class="chip pair" style="overflow:hidden"><span style="background:var(--bw-info)"></span><span style="background:var(--bw-info-deep)"></span><span style="background:var(--bw-info-wash)"></span></div><span class="n">Info</span><span class="v">#2271B1 / #135E96</span></div>
</div></body></html>
