<!-- @dsCard group="Colors" viewport="700x150" name="Brand & ink" subtitle="Indigo accent and the near-black ink it sits on" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Brand & ink</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--bw-font-body);color:var(--bw-text-body)}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;border-radius:var(--bw-radius-md);border:1px solid rgb(10 12 41 / .07)}.n{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--bw-text-body)}.v{font-size:11px;color:var(--bw-text-faint);font-family:var(--bw-font-mono)}.row{display:grid;gap:12px}</style></head><body class="bw-admin" style="background:#fff"><div class="row" style="grid-template-columns:repeat(5,1fr)">
<div class="sw"><div class="chip" style="background:var(--bw-brand)"></div><span class="n">Brand</span><span class="v">#4F46E5</span></div>
<div class="sw"><div class="chip" style="background:var(--bw-brand-deep)"></div><span class="n">Brand deep</span><span class="v">#4338CA</span></div>
<div class="sw"><div class="chip" style="background:var(--bw-brand-wash)"></div><span class="n">Brand wash</span><span class="v">#EEEDFC</span></div>
<div class="sw"><div class="chip" style="background:var(--bw-ink)"></div><span class="n">Ink</span><span class="v">#0A0C29</span></div>
<div class="sw"><div class="chip" style="background:var(--bw-ink-soft)"></div><span class="n">Ink soft</span><span class="v">#5B5D74</span></div>
</div></body></html>
