<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Neutrals</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--bw-font-body);color:var(--bw-text-body)}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;border-radius:var(--bw-radius-md);border:1px solid rgb(10 12 41 / .07)}.n{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--bw-text-body)}.v{font-size:11px;color:var(--bw-text-faint);font-family:var(--bw-font-mono)}.row{display:grid;gap:12px}</style></head><body class="bw-admin" style="background:#fff"><div class="row" style="grid-template-columns:repeat(5,1fr)">
<div class="sw"><div class="chip" style="background:var(--bw-paper)"></div><span class="n">Paper</span><span class="v">#FFFFFF</span></div>
<div class="sw"><div class="chip" style="background:var(--bw-canvas)"></div><span class="n">Canvas</span><span class="v">#F7F8FC</span></div>
<div class="sw"><div class="chip" style="background:var(--bw-field)"></div><span class="n">Field</span><span class="v">#F5F6FB</span></div>
<div class="sw"><div class="chip" style="background:var(--bw-line)"></div><span class="n">Line</span><span class="v">#ECEDF3</span></div>
<div class="sw"><div class="chip" style="background:var(--bw-line-strong)"></div><span class="n">Line strong</span><span class="v">#DCDEE8</span></div>
</div></body></html>
