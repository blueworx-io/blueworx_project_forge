<!-- @dsCard group="Colors" viewport="700x150" name="WordPress host chrome" subtitle="The admin we live inside — use only to match wp-admin itself" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>WP chrome</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--bw-font-body);color:var(--bw-text-body)}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;border-radius:var(--bw-radius-md);border:1px solid rgb(10 12 41 / .07)}.n{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--bw-text-body)}.v{font-size:11px;color:var(--bw-text-faint);font-family:var(--bw-font-mono)}.row{display:grid;gap:12px}</style></head><body class="bw-admin" style="background:#fff"><div class="row" style="grid-template-columns:repeat(4,1fr)">
<div class="sw"><div class="chip" style="background:var(--wp-admin-menu)"></div><span class="n">Admin menu</span><span class="v">#1D2327</span></div>
<div class="sw"><div class="chip" style="background:var(--wp-admin-bg)"></div><span class="n">Admin body</span><span class="v">#F0F0F1</span></div>
<div class="sw"><div class="chip" style="background:var(--wp-admin-blue)"></div><span class="n">WP blue</span><span class="v">#2271B1</span></div>
<div class="sw"><div class="chip" style="background:var(--wp-admin-border)"></div><span class="n">WP border</span><span class="v">#C3C4C7</span></div>
</div></body></html>
