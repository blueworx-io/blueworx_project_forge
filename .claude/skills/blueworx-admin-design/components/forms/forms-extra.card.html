<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Form extras</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:#fff}</style></head>
<body class="bw-admin" style="background:#fff"><div id="root"></div>
<script type="text/babel">
const { FormRow, ColorField, CopyField, RangeField, UploadField, Repeater, Input, Select, Switch } = window.BlueWorxAdminDesignSystem_75753e;
function Demo() {
  const [color, setColor] = React.useState('#4F46E5');
  const [mins, setMins] = React.useState(30);
  const [rows, setRows] = React.useState([{ id: 1, name: 'Pro annual', price: '180' }, { id: 2, name: 'Monthly', price: '18' }]);
  return (
    <>
      <FormRow label="Currency" htmlFor="f-cur" help="Applies to new orders only."><Select id="f-cur" options={['GBP £', 'EUR €', 'USD $']} /></FormRow>
      <FormRow label="Test mode" tip="Nothing is charged while test mode is on."><Switch bare aria-label="Test mode" defaultChecked /></FormRow>
      <FormRow label="Accent colour"><ColorField value={color} onChange={setColor} /></FormRow>
      <FormRow label="Shortcode"><CopyField value='[bw_members plan="pro"]' /></FormRow>
      <FormRow label="Cache lifetime"><RangeField value={mins} min={0} max={120} step={5} unit=" min" onChange={setMins} /></FormRow>
      <FormRow label="Import members" help="Columns: name, email, plan, joined."><UploadField hint="CSV up to 5 MB." onChoose={() => {}} /></FormRow>
      <FormRow label="Plans">
        <Repeater
          items={rows}
          addLabel="Add plan"
          onAdd={() => setRows((r) => [...r, { id: Date.now(), name: '', price: '' }])}
          onRemove={(id) => setRows((r) => r.filter((x) => x.id !== id))}
          renderRow={(p) => (<><Input defaultValue={p.name} aria-label="Plan name" placeholder="Plan name" /><Input defaultValue={p.price} affix="/yr" aria-label="Price" placeholder="0" /></>)}
          emptyLabel="No plans yet. Add one to start taking memberships." />
      </FormRow>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
