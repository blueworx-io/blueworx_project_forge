<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Data</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:#fff}#root{display:flex;flex-direction:column;gap:18px}.grp{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--bw-text-faint);width:74px;flex:none}</style></head>
<body class="bw-admin" style="background:#fff"><div id="root"></div>
<script type="text/babel">
const { DataTable, StatCard, Card, Badge, IconButton, Button, Input, Select } = window.BlueWorxAdminDesignSystem_75753e;

const ROWS = [
  { id: 1, name: <><span className="bw-table__primary">Priya Raman</span><span className="bw-table__sub">priya@example.com</span></>, plan: 'Season · £180/yr', status: <Badge tone="success">Active</Badge>, spend: '£540' },
  { id: 2, name: <><span className="bw-table__primary">Tom Okafor</span><span className="bw-table__sub">tom@example.com</span></>, plan: 'Monthly · £18/mo', status: <Badge tone="warning">Payment failed</Badge>, spend: '£126' },
  { id: 3, name: <><span className="bw-table__primary">Ellie Vance</span><span className="bw-table__sub">ellie@example.com</span></>, plan: 'Season · £180/yr', status: <Badge tone="neutral" dot>Paused</Badge>, spend: '£180' },
];
function Demo() {
  const [sel, setSel] = React.useState([2]);
  return (
    <>
      <div className="bw-stats">
        <StatCard label="Revenue" value="£12,480" icon="chart-column" delta="+12.4%" footnote="vs last 30 days" />
        <StatCard label="Members" value="318" icon="users" delta="+9" footnote="new this month" />
        <StatCard label="Failed payments" value="3" icon="triangle-alert" delta="-2" direction="down" footnote="needs attention" />
      </div>
      <Card flush title="Members" actions={<Button size="sm" icon="download">Export</Button>}>
        <div className="bw-toolbar">
          <span className="bw-toolbar__search"><Input icon="search" size="sm" placeholder="Search members" /></span>
          <span style={{ width: 160 }}><Select placeholder="All statuses" options={['Active', 'Paused']} /></span>
          <span className="bw-toolbar__spacer" />
          <span style={{ fontSize: 12, color: 'var(--bw-text-muted)' }}>{sel.length} selected</span>
        </div>
        <DataTable
          columns={[{ key: 'name', label: 'Member' }, { key: 'plan', label: 'Plan' }, { key: 'status', label: 'Status' }, { key: 'spend', label: 'Spend', align: 'right' }]}
          rows={ROWS} selectable selected={sel}
          onToggle={(id) => setSel((s) => s.includes(id) ? s.filter((x) => x !== id) : [...s, id])}
          onToggleAll={(c) => setSel(c ? ROWS.map((r) => r.id) : [])}
          rowActions={() => <><IconButton icon="pencil" label="Edit" size="sm" /><IconButton icon="trash-2" label="Delete" size="sm" variant="danger" /></>} />
        <div className="bw-tablefoot"><span>3 of 318</span><span>Page 1 of 106</span></div>
      </Card>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
