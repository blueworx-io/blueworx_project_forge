name: CI
on: pull_request
jobs:
  guardrails:
    uses: blueworx-io/bluegroup_core_foundation/.github/workflows/ci-wordpress.yml@v1
    with:
      # Tests run against a disposable real WordPress the run provisions itself
      # (PHP + SQLite, no Docker, no hosting). Never a hosted staging site: a
      # placeholder URL is how a suite skips itself while reporting green.
      use_local_wordpress: true
      plugin_slug: blueworx-forge
      # Must match the @ref above. This input defaults to `main`, so pinning only
      # the @ref would run the v1 workflow against the foundation's main branch.
      foundation_ref: v1
      # Forge's front end is a Vite app: the built bundle in assets/ is what
      # WordPress serves, so the TypeScript source and the build tooling that
      # produces it have no business on a live site. Keep this identical to
      # release.yml — the PR-time content check and the release build must agree
      # about what ships.
      exclude_paths: |
        /src
        /design
        # The client artifact is built from its own allowlist by
        # bin/build-zip.sh and published by its own release job. It has no
        # business inside the studio zip — that is the whole point of two
        # artifacts (ARCH-1).
        /client
        /playwright-report.json
        # The pair suite's config. The foundation's own excludes list covers
        # playwright.config.js but knows nothing about a second one, so without
        # this line it shipped to live sites in v2.8.0.
        /playwright.pair.config.js
        /playwright-pair-report.json
        /index.html
        /vite.config.*
        /tsconfig.json
        /postcss.config.mjs
        /vendor
        /.vscode
        /.playwright-mcp
        /.wp-test
    # Specs that sign in to wp-admin need WP_ADMIN_USER and WP_ADMIN_PASS.
    # Without them those specs skip themselves and the run asserts nothing.
    secrets: inherit

  # Node's own test runner, for the tooling that has no browser in it. The
  # decision-record completeness check runs inside `npm run lint` above; this
  # job proves the checker itself still works, including its failure cases.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 20: test:unit passes a glob to `node --test`, and Node only
          # learned to expand those in 22. On 20 it reported "Could not find
          # tests/unit/**/*.test.mjs" and failed — which at least failed loudly
          # rather than running nothing and calling it a pass.
          node-version: 24
      - run: npm run test:unit

      # The foundation runs PHPCS and PHPUnit only when it finds their config
      # files, and says so in the log rather than failing. That is the right
      # default for a repo that has neither — and exactly wrong for this one,
      # where deleting either file would silently drop a required check and
      # leave the build green. So assert they are still there.
      - name: The PHP checks are still configured
        run: |
          for f in phpcs.xml.dist phpunit.xml.dist; do
            [ -f "$f" ] || { echo "$f is missing — PHP checks would silently stop running." >&2; exit 1; }
          done
          grep -q 'failOnEmptyTestSuite="true"' phpunit.xml.dist \
            || { echo 'phpunit.xml.dist must keep failOnEmptyTestSuite="true" — a suite that runs nothing exits 0 without it.' >&2; exit 1; }

  # The two-instance suite (#86). Its own job because the shared foundation
  # workflow provisions exactly one WordPress — right for every other project,
  # and not enough for a repo whose whole point is a studio talking to a client.
  # It drives the same harness script that job does, twice, so the pair cannot
  # drift from the single instance everything else is tested against.
  pair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The harness lives in the foundation repo, which this one expects as a
      # sibling directory — the same shape as a developer's machine.
      - name: Checkout the foundation beside this repo
        uses: actions/checkout@v4
        with:
          repository: blueworx-io/bluegroup_core_foundation
          ref: v1
          path: .foundation

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite

      - run: npm ci

      # The studio site serves the built bundle, so it has to exist first.
      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - name: Provision the studio and client pair
        run: npm run wp:pair:up

      # test:pair fails the build if the run executed nothing, so a suite that
      # quietly stops reaching its sites cannot report green.
      - name: Run the two-instance suite
        env:
          BWX_CLIENT_BASE_URL: http://127.0.0.1:8893
          WP_ADMIN_USER: admin
          WP_ADMIN_PASS: wptest-admin-pw
        run: npm run test:pair

      - name: Tear the pair down
        if: always()
        run: npm run wp:pair:down || true
