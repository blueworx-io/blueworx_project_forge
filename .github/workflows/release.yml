name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    uses: blueworx-io/bluegroup_core_foundation/.github/workflows/release-wordpress.yml@v1
    with:
      plugin_slug: blueworx-forge
      foundation_ref: v1
      # Keep identical to ci.yml's input of the same name, or the PR-time check
      # and the release build disagree about what ships.
      exclude_paths: |
        /src
        /design
        /client
        /playwright-report.json
        # The pair suite's config. The foundation's own excludes list covers
        # playwright.config.js but knows nothing about a second one, so without
        # this line it shipped to live sites in v2.8.0.
        /playwright.pair.config.js
        /playwright-pair-report.json
        /index.html
        /vite.config.*
        /tsconfig.json
        /postcss.config.mjs
        /vendor
        # Vendored for the client plugin, which registers the shared page editor.
        # The studio's screens are the React application (ARCH-7), so this has no
        # business in the studio artifact. Keep identical to ci.yml.
        /blueworx-page-editor
        /.vscode
        /.playwright-mcp
        /.wp-test
    # Required: a reusable workflow cannot widen the permissions its caller
    # gives it, so without this the publish step fails with a 403.
    permissions:
      contents: write

  # The client artifact, attached to the same Release.
  #
  # Not a second call to the shared workflow: that workflow finds a plugin's main
  # file by scanning the repo root, and this repo has exactly one there on
  # purpose. It builds from bin/artifacts.json — the same allowlist a pull
  # request is checked against — so what ships to a client site is what CI
  # verified, not a second description of it.
  release-client:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Refuses to build if the allowlists would let studio code into the client
      # artifact. Belt and braces: the same check gates every pull request.
      - name: The allowlists are shippable
        run: node bin/check-artifacts.mjs

      - name: Build the client zip
        run: bash bin/build-zip.sh client "$RUNNER_TEMP/artifacts"

      # The tag is checked against the studio header by the job above, and
      # check-artifacts.mjs requires both headers to agree — so a mismatch here
      # means one of those two ran on a different tree.
      - name: The client zip matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="blueworx-forge-client-${TAG#v}.zip"
          if [ ! -f "$RUNNER_TEMP/artifacts/$expected" ]; then
            echo "::error title=Client zip does not match the tag::expected $expected, found:"
            ls -1 "$RUNNER_TEMP/artifacts" | sed 's/^/  /'
            exit 1
          fi

      - name: Attach it to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/artifacts/blueworx-forge-client-${TAG#v}.zip" --clobber

  # The same Release again, on the public releases-only repository (#340).
  #
  # This repository is private, so a site could only see its releases with a
  # token entered on it — unworkable across hundreds of client sites. Both
  # plugins' update checkers point at the public repository instead, which
  # holds nothing but these releases and their two zips: never the source.
  # Sites update themselves with nothing entered on them.
  #
  # Needs one secret, FORGE_RELEASES_TOKEN: a fine-grained token with
  # "Contents: read and write" on the public repository only. Without it this
  # job fails and says so, while the Release above still stands here.
  mirror:
    needs: release-client
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      SOURCE: ${{ github.repository }}
      # Keep equal to Updates::REPO in both plugins and to the update checker
      # URLs in blueworx-forge.php and client/blueworx-forge-client.php.
      TARGET: blueworx-io/blueworx_project_forge_releases
    steps:
      - name: The secret is set
        env:
          MIRROR_TOKEN: ${{ secrets.FORGE_RELEASES_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error title=No FORGE_RELEASES_TOKEN::Add a fine-grained token with Contents: read and write on $TARGET as the FORGE_RELEASES_TOKEN secret. Sites update from $TARGET, and this release is not there yet."
            exit 1
          fi

      - name: Fetch the two zips and the notes from this Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mirror"
          gh release download "$TAG" --repo "$SOURCE" --dir "$RUNNER_TEMP/mirror" --pattern 'blueworx-forge-*.zip'
          gh release view "$TAG" --repo "$SOURCE" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          ls -1 "$RUNNER_TEMP/mirror"
          # Both plugins, or nothing: a public release missing one zip would
          # offer half the sites an update that is not there.
          test -f "$RUNNER_TEMP/mirror/blueworx-forge-${TAG#v}.zip"
          test -f "$RUNNER_TEMP/mirror/blueworx-forge-client-${TAG#v}.zip"

      - name: Publish them on the public repository
        env:
          GH_TOKEN: ${{ secrets.FORGE_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$TARGET" >/dev/null 2>&1; then
            # A re-run: replace the assets rather than fail on the existing Release.
            gh release upload "$TAG" "$RUNNER_TEMP"/mirror/*.zip --repo "$TARGET" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP"/mirror/*.zip --repo "$TARGET" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
